[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kaori_kabu"
version = "0.1.0"
description = "かおりんの個人ローカル株運用ダッシュボード — 世界トップ投資家の手法を AI で再現"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Kaori Hosoda" },
]
keywords = ["finance", "stock", "trading", "backtest", "portfolio", "magic-formula", "13f"]

dependencies = [
    # --- データ取得・統合 ---
    "openbb>=4.4.0",
    "openbb-eodhd>=1.0.0",
    "openbb-fred>=1.0.0",
    "openbb-sec>=1.0.0",
    "yfinance>=0.2.40",
    "jquantsapi>=1.7.0",
    "pandas-datareader>=0.10.0",

    # --- データフレーム・数値計算 ---
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "polars>=1.0.0",

    # --- バックテスト・量的分析 ---
    "vectorbt>=0.26.0",
    "backtrader>=1.9.78",

    # --- ポートフォリオ最適化 ---
    "riskfolio-lib>=6.0.0",
    "PyPortfolioOpt>=1.5.5",

    # --- パフォーマンス・リスク指標 ---
    "quantstats>=0.0.62",
    "empyrical-reloaded>=0.5.10",

    # --- テクニカル指標 ---
    "pandas-ta>=0.3.14b0",

    # --- 統計・機械学習 ---
    "hmmlearn>=0.3.2",
    "statsmodels>=0.14.2",
    "scikit-learn>=1.5.0",
    "arch>=7.0.0",

    # --- 銘柄マスタ ---
    "financedatabase>=2.4.0",

    # --- ダッシュボード・可視化 ---
    "streamlit>=1.39.0",
    "plotly>=5.24.0",
    "altair>=5.4.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.2",

    # --- HTTP / API クライアント ---
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "aiohttp>=3.10.0",
    "tenacity>=9.0.0",
    "ratelimit>=2.2.1",

    # --- 設定・ユーティリティ ---
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "rich>=13.8.0",
    "click>=8.1.7",

    # --- データキャッシュ ---
    "pyarrow>=17.0.0",
    "duckdb>=1.0.0",

    # --- 日付・タイムゾーン ---
    "pendulum>=3.0.0",
    "pytz>=2024.2",

    # --- センチメント・ニュース ---
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "selectolax>=0.3.21",

    # --- LLM 統合（オプション） ---
    "anthropic>=0.34.0",
    "openai>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-benchmark>=4.0.0",
    "hypothesis>=6.112.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "pyright>=1.1.380",
    "ipython>=8.27.0",
    "jupyterlab>=4.2.0",
    "jupytext>=1.16.0",
    "ipykernel>=6.29.0",
    "pre-commit>=3.8.0",
]

ml = [
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "xgboost>=2.1.0",
    "lightgbm>=4.5.0",
]

[project.scripts]
kabu = "src.cli:main"
kabu-dashboard = "src.dashboard.app:main"

[project.urls]
Homepage = "https://github.com/hosoda/kaori_kabu"
Issues = "https://github.com/hosoda/kaori_kabu/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "dist", "notebooks", "data"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "PD", "NPY", "PT", "RET", "SIM", "RUF"]
ignore = ["E501", "PD901"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-fail-under=80",
]
markers = [
    "slow: 実 API を叩く重いテスト",
    "integration: 統合テスト",
    "unit: ユニットテスト",
    "smoke: スモークテスト",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/dashboard/app.py", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
fail_under = 80
show_missing = true

[tool.pyright]
include = ["src", "tests"]
exclude = [".venv", "build", "dist", "notebooks", "data"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
